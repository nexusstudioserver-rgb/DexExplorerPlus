name: Release out.lua

on:
  push:
    branches: [main]
    paths: ["out.lua"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make sure the latest release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create latest --repo "${{ github.repository }}" \
              --title "Latest build" --notes "Rolling Dex++ build (auto-published)."

      - name: Replace out.lua on the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload latest out.lua --repo "${{ github.repository }}" --clobber

      # Optional: also publish a versioned release on tags like v1.0.1
      # (only runs when you push a tag, not on normal pushes)
